      #     haskell: true
      #     large-packages: true
      #     swap-storage: true
      #     docker-images: true

      - name: Checkout
        uses: actions/checkout@v5

      - name: Turn off addons
        run: |
          node ./scripts/turnOffEverything.js

      - name: Setup
        uses: ./.github/actions/setup

      - name: Install JDK
        uses: actions/setup-java@v3
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Gradle cache
        uses: gradle/actions/setup-gradle@v3

      # - name: AVD cache
      #   uses: actions/cache@v4
      #   id: avd-cache
      #   with:
      #     path: |
      #       ~/.android/avd/*
      #       ~/.android/adb*
      #     key: avd-29

      # - name: create AVD and generate snapshot for caching
      #   # if: steps.avd-cache.outputs.cache-hit != 'true'
      #   uses: reactivecircus/android-emulator-runner@v2
      #   with:
      #     api-level: 29
      #     force-avd-creation: false
      #     emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
      #     disable-animations: false
      #     script: echo "Generated AVD snapshot for caching."

      - name: Give execute permissions to script
        run: chmod +x ./scripts/test-android.sh

      - name: run tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            ./scripts/test-android.sh

      - name: Upload Android diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-logcat-${{ github.job }}
          path: example/android-logcat.txt
          if-no-files-found: ignore

  android-sqlcipher:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      # - name: Free Disk Space (Ubuntu)
      #   uses: insightsengineering/disk-space-reclaimer@v1

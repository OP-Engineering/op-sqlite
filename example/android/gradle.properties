org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m
android.useAndroidX=true
reactNativeArchitectures=armeabi-v7a,arm64-v8a,x86,x86_64
newArchEnabled=true
hermesEnabled=true
edgeToEdgeEnabled=false

# AGP 9's built-in Kotlin support auto-registers a `kotlin` extension, which
# collides with this project's own explicit `apply plugin:
# "org.jetbrains.kotlin.android"` ("Cannot add extension with name 'kotlin',
# as there is an extension already registered with that name"). Opt out per
# RN 0.87's AGP 9 migration notes; these flags are removed in AGP 10.x.
android.builtInKotlin=false
android.newDsl=false